<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aditya — JEE Aspirant</title>

    <meta name="description"
          content="Aditya's personal website — websites, tools and experiments I've created.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #0a0a0a;
            color: #f5f5f5;

            line-height: 1.6;

            overscroll-behavior: none;
            touch-action: pan-y;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================
           BACKGROUND GLOW
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -250px;
            left: 50%;

            transform: translateX(-50%);

            background: radial-gradient(
                circle,
                rgba(255,255,255,0.07),
                transparent 70%
            );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            background: rgba(10,10,10,0.75);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.07);

            z-index: 100;
        }

        .logo {
            font-size: 20px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;

            gap: 28px;

            list-style: none;

            color: #aaa;

            font-size: 14px;
        }

        .nav-links a {
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {
            width: 100%;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 70px 20px 20px;

            position: relative;

            z-index: 1;
        }

        .hero-content {
            width: 100%;
            max-width: 800px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================================
           TOP ANCHOR
           JEE ASPIRANT STAYS FIXED
        ========================================= */

        .small-label {
            display: inline-block;

            color: #aaa;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 20px;

            transform-origin: center bottom;

            will-change: transform;
        }


        /* =========================================
           MIDDLE CONTENT
        ========================================= */

        .middle-content {
            display: flex;
            flex-direction: column;
            align-items: center;

            transform-origin: center top;

            will-change: transform;
        }

        .hero h1 {
            font-size: clamp(55px, 10vw, 110px);

            line-height: 0.95;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 28px;

            transform-origin: center;

            will-change: transform;
        }

        .hero p {
            max-width: 600px;

            color: #aaa;

            font-size: 18px;

            line-height: 1.7;

            transform-origin: center;

            will-change: transform;
        }


        /* =========================================
           BOTTOM ANCHOR
           BUTTONS STAY FIXED
        ========================================= */

        .hero-buttons {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            transform-origin: center top;

            will-change: transform;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 12px 22px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .button-primary {
            background: white;
            color: black;
        }

        .button-primary:hover {
            transform: translateY(-2px);

            background: #e8e8e8;
        }

        .button-secondary {
            border: 1px solid #333;

            color: #ddd;
        }

        .button-secondary:hover {
            border-color: #666;

            transform: translateY(-2px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;

                font-size: 12px;
            }

            .hero {
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero h1 {
                letter-spacing: 1px;
            }

            .hero p {
                font-size: 16px;
            }
        }


        /* =========================================
           SMALL HEIGHT DEVICES
        ========================================= */

        @media (max-height: 600px) {

            .hero h1 {
                font-size: clamp(45px, 9vw, 75px);

                margin-bottom: 20px;
            }

            .small-label {
                margin-bottom: 12px;
            }

            .hero-buttons {
                margin-top: 25px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <nav>

        <a href="index.html" class="logo">
            ADITYA
        </a>

        <ul class="nav-links">

            <li>
                <a href="projects.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="https://github.com/aditya20490"
                   target="_blank"
                   rel="noopener noreferrer">
                    GitHub
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================================
         HERO
    ========================================= -->

    <main class="hero">

        <div class="hero-content">


            <!-- TOP ANCHOR -->

            <div class="small-label" id="topAnchor">
                JEE Aspirant
            </div>


            <!-- MIDDLE CONTENT -->

            <div class="middle-content" id="middleContent">

                <h1 id="name">
                    ADITYA
                </h1>

                <p id="description">
                    I build websites, tools and experiments to solve
                    the small problems I come across.
                </p>

            </div>


            <!-- BOTTOM ANCHOR -->

            <div class="hero-buttons" id="bottomAnchor">

                <a href="projects.html"
                   class="button button-primary">
                    Explore My Projects
                </a>

                <a href="https://github.com/aditya20490"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="button button-secondary">
                    GitHub ↗
                </a>

            </div>


        </div>

    </main>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const topAnchor =
            document.getElementById("topAnchor");

        const middleContent =
            document.getElementById("middleContent");

        const name =
            document.getElementById("name");

        const description =
            document.getElementById("description");

        const bottomAnchor =
            document.getElementById("bottomAnchor");


        /* =========================================
           SETTINGS

           VERY SMALL VALUES ON PURPOSE.
        ========================================= */

        const MAX_EFFECT = 12;

        let effect = 0;

        let startY = 0;

        let dragging = false;

        let wheelTimer;


        /* =========================================
           UPDATE VISUAL EFFECT
        ========================================= */

        function updateEffect(value) {

            effect = Math.max(
                -MAX_EFFECT,
                Math.min(MAX_EFFECT, value)
            );


            /*
             ----------------------------------------
             Pull DOWN
             (finger moves down)

             TOP ANCHOR remains still.

             Middle content compresses upward
             toward JEE Aspirant.

             Buttons remain stable.
             ----------------------------------------
            */

            if (effect > 0) {

                const amount = effect;

                middleContent.style.transform =
                    `translateY(${-amount * 0.35}px)
                     scaleY(${1 - amount * 0.006})`;

                name.style.transform =
                    `scaleY(${1 - amount * 0.008})`;

                description.style.transform =
                    `scaleY(${1 - amount * 0.012})`;

                bottomAnchor.style.transform =
                    "translateY(0)";

            }


            /*
             ----------------------------------------
             Pull UP
             (finger moves up)

             BOTTOM ANCHOR remains stable.

             Middle content compresses downward
             toward the buttons.

             JEE Aspirant remains stable.
             ----------------------------------------
            */

            else {

                const amount = Math.abs(effect);

                middleContent.style.transform =
                    `translateY(${amount * 0.35}px)
                     scaleY(${1 - amount * 0.006})`;

                name.style.transform =
                    `scaleY(${1 - amount * 0.008})`;

                description.style.transform =
                    `scaleY(${1 - amount * 0.012})`;

                bottomAnchor.style.transform =
                    "translateY(0)";
            }
        }


        /* =========================================
           RESET
        ========================================= */

        function resetEffect() {

            topAnchor.style.transition =
                "none";

            middleContent.style.transition =
                "transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)";

            name.style.transition =
                "transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)";

            description.style.transition =
                "transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)";

            bottomAnchor.style.transition =
                "transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)";


            middleContent.style.transform =
                "translateY(0) scaleY(1)";

            name.style.transform =
                "scaleY(1)";

            description.style.transform =
                "scaleY(1)";

            bottomAnchor.style.transform =
                "translateY(0)";

            effect = 0;
        }


        /* =========================================
           TOUCH START
        ========================================= */

        document.addEventListener(
            "touchstart",
            function(event) {

                if (event.touches.length !== 1) {
                    return;
                }

                startY =
                    event.touches[0].clientY;

                dragging = true;


                middleContent.style.transition =
                    "none";

                name.style.transition =
                    "none";

                description.style.transition =
                    "none";

                bottomAnchor.style.transition =
                    "none";

            },
            {
                passive: true
            }
        );


        /* =========================================
           TOUCH MOVE
        ========================================= */

        document.addEventListener(
            "touchmove",
            function(event) {

                if (!dragging) {
                    return;
                }

                const currentY =
                    event.touches[0].clientY;

                const movement =
                    currentY - startY;


                /*
                    Very strong resistance.

                    This makes the effect subtle
                    rather than looking like rubber.
                */

                const resistance =
                    movement * 0.08;


                updateEffect(resistance);

            },
            {
                passive: true
            }
        );


        /* =========================================
           TOUCH END
        ========================================= */

        document.addEventListener(
            "touchend",
            function() {

                if (!dragging) {
                    return;
                }

                dragging = false;

                resetEffect();

            },
            {
                passive: true
            }
        );


        /* =========================================
           MOUSE WHEEL / TRACKPAD
        ========================================= */

        window.addEventListener(
            "wheel",
            function(event) {

                event.preventDefault();


                const movement =
                    -event.deltaY * 0.035;


                updateEffect(
                    effect + movement
                );


                clearTimeout(wheelTimer);


                wheelTimer = setTimeout(
                    resetEffect,
                    100
                );

            },
            {
                passive: false
            }
        );


        /* =========================================
           KEYBOARD
        ========================================= */

        window.addEventListener(
            "keydown",
            function(event) {

                const blockedKeys = [
                    "ArrowUp",
                    "ArrowDown",
                    "PageUp",
                    "PageDown",
                    "Home",
                    "End",
                    " "
                ];


                if (
                    blockedKeys.includes(event.key)
                ) {

                    event.preventDefault();


                    if (
                        event.key === "ArrowUp" ||
                        event.key === "PageUp"
                    ) {

                        updateEffect(
                            effect - 5
                        );

                    }


                    if (
                        event.key === "ArrowDown" ||
                        event.key === "PageDown"
                    ) {

                        updateEffect(
                            effect + 5
                        );

                    }


                    clearTimeout(wheelTimer);


                    wheelTimer = setTimeout(
                        resetEffect,
                        100
                    );
                }

            }
        );

    </script>

</body>
</html>
