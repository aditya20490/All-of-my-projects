<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aditya — JEE Aspirant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #f5f5f5;
      overscroll-behavior: none;
      touch-action: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255, 255, 255, 0.035),
          transparent 38%
        );
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 34px;

      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      z-index: 10;
    }

    .logo {
      color: #fff;
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #8e8e8e;
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;

      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #fff;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 24px 0;

      z-index: 1;
    }

    .hero-content {
      width: min(720px, 100%);

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       JEE ASPIRANT
    ========================= */

    .small-label {
      color: #8d8d8d;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;

      transform: translate3d(0, 0, 0);
    }


    /* =========================
       ADITYA
    ========================= */

    .name {
      margin-top: 28px;

      color: #fff;

      font-size: clamp(52px, 9vw, 92px);
      line-height: 0.95;

      font-weight: 700;
      letter-spacing: 1.8px;

      white-space: nowrap;

      transform: translate3d(0, 0, 0);
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      max-width: 570px;

      margin-top: 18px;

      color: #8f8f8f;

      font-size: 15px;
      line-height: 1.7;

      text-align: center;

      transform: translate3d(0, 0, 0);
    }


    /* =========================
       BUTTONS
    ========================= */

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 34px;

      transform: translate3d(0, 0, 0);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      height: 44px;
      padding: 0 20px;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button-primary {
      background: #fff;
      color: #0a0a0a;
    }

    .button-primary:hover {
      transform: translateY(-2px);
      background: #e9e9e9;
    }

    .button-secondary {
      color: #eee;

      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.035);
    }

    .button-secondary:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.07);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      nav {
        height: 62px;
        padding: 0 20px;
      }

      .nav-links {
        gap: 18px;
      }

      .nav-links a {
        font-size: 12px;
      }

      .hero {
        padding-top: 62px;
      }

      .small-label {
        font-size: 12px;
      }

      .name {
        margin-top: 24px;

        font-size: clamp(48px, 15vw, 70px);
        letter-spacing: 1px;
      }

      .description {
        max-width: 330px;

        margin-top: 16px;

        font-size: 14px;
        line-height: 1.65;
      }

      .hero-buttons {
        margin-top: 28px;
        gap: 9px;
      }

      .button {
        height: 42px;
        padding: 0 16px;
        font-size: 12px;
      }
    }
  </style>
</head>


<body>

  <!-- NAVIGATION -->

  <nav>

    <a href="index.html" class="logo">
      ADITYA
    </a>

    <div class="nav-links">

      <a href="projects.html">
        Projects
      </a>

      <a
        href="https://github.com/aditya20490"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>

    </div>

  </nav>


  <!-- HERO -->

  <main class="hero">

    <div class="hero-content" id="heroContent">

      <div class="small-label" id="topAnchor">
        JEE Aspirant
      </div>

      <h1 class="name" id="name">
        ADITYA
      </h1>

      <p class="description" id="description">
        I build websites, tools and experiments to solve the small problems I come across.
      </p>

      <div class="hero-buttons" id="bottomAnchor">

        <a
          href="projects.html"
          class="button button-primary"
        >
          Explore My Projects
        </a>

        <a
          href="https://github.com/aditya20490"
          target="_blank"
          rel="noopener noreferrer"
          class="button button-secondary"
        >
          GitHub ↗
        </a>

      </div>

    </div>

  </main>


  <script>

    /*
    ============================================================
      SUBTLE IOS-STYLE RUBBER-BAND OVERSCROLL
    ============================================================
    */


    const topAnchor =
      document.getElementById("topAnchor");

    const name =
      document.getElementById("name");

    const description =
      document.getElementById("description");

    const bottomAnchor =
      document.getElementById("bottomAnchor");


    /*
      Reduced from 18px → 10px.

      This makes the maximum movement
      considerably more subtle.
    */

    const MAX_OVERSCROLL = 10;


    /*
      Reduced from 0.22 → 0.16.

      The user has to pull farther to create
      the same visual movement.
    */

    const RESISTANCE = 0.16;


    let touchStartY = null;
    let overscroll = 0;
    let resetTimer = null;


    /*
    ============================================================
      APPLY OVERSCROLL
    ============================================================
    */

    function applyOverscroll(amount) {

      if (amount <= 0) {

        topAnchor.style.transform =
          "translate3d(0, 0, 0)";

        name.style.transform =
          "translate3d(0, 0, 0)";

        description.style.transform =
          "translate3d(0, 0, 0)";

        bottomAnchor.style.transform =
          "translate3d(0, 0, 0)";

        return;
      }


      const value = Math.min(
        amount,
        MAX_OVERSCROLL
      );


      /*
        JEE Aspirant
        FIXED
      */

      topAnchor.style.transform =
        "translate3d(0, 0, 0)";


      /*
        ADITYA
        Very subtle movement.
      */

      name.style.transform =
        `translate3d(0, ${-value * 0.24}px, 0)`;


      /*
        DESCRIPTION
        Slightly stronger movement.
      */

      description.style.transform =
        `translate3d(0, ${-value * 0.47}px, 0)`;


      /*
        BUTTONS
        Largest movement, but still subtle.
      */

      bottomAnchor.style.transform =
        `translate3d(0, ${-value * 0.70}px, 0)`;
    }


    /*
    ============================================================
      RESET
    ============================================================
    */

    function resetOverscroll() {

      const transition =
        "transform 420ms cubic-bezier(.22,.8,.25,1)";


      topAnchor.style.transition = transition;
      name.style.transition = transition;
      description.style.transition = transition;
      bottomAnchor.style.transition = transition;


      topAnchor.style.transform =
        "translate3d(0, 0, 0)";

      name.style.transform =
        "translate3d(0, 0, 0)";

      description.style.transform =
        "translate3d(0, 0, 0)";

      bottomAnchor.style.transform =
        "translate3d(0, 0, 0)";


      overscroll = 0;


      clearTimeout(resetTimer);

      resetTimer = setTimeout(() => {

        topAnchor.style.transition = "";
        name.style.transition = "";
        description.style.transition = "";
        bottomAnchor.style.transition = "";

      }, 450);
    }


    /*
    ============================================================
      TOUCH START
    ============================================================
    */

    document.addEventListener(
      "touchstart",
      (event) => {

        if (event.touches.length !== 1) {
          return;
        }

        touchStartY =
          event.touches[0].clientY;


        topAnchor.style.transition = "none";
        name.style.transition = "none";
        description.style.transition = "none";
        bottomAnchor.style.transition = "none";

      },
      {
        passive: true
      }
    );


    /*
    ============================================================
      TOUCH MOVE
    ============================================================
    */

    document.addEventListener(
      "touchmove",
      (event) => {

        if (touchStartY === null) {
          return;
        }


        const currentY =
          event.touches[0].clientY;


        const delta =
          touchStartY - currentY;


        /*
          Swiping DOWN:
          absolutely no effect.
        */

        if (delta <= 0) {

          overscroll = 0;

          applyOverscroll(0);

          return;
        }


        /*
          Subtle rubber-band resistance.
        */

        overscroll =
          Math.min(
            delta * RESISTANCE,
            MAX_OVERSCROLL
          );


        applyOverscroll(overscroll);

      },
      {
        passive: true
      }
    );


    /*
    ============================================================
      TOUCH END
    ============================================================
    */

    document.addEventListener(
      "touchend",
      () => {

        if (touchStartY === null) {
          return;
        }

        touchStartY = null;

        resetOverscroll();

      },
      {
        passive: true
      }
    );


    /*
    ============================================================
      TOUCH CANCEL
    ============================================================
    */

    document.addEventListener(
      "touchcancel",
      () => {

        touchStartY = null;

        resetOverscroll();

      },
      {
        passive: true
      }
    );


    /*
    ============================================================
      MOUSE / TRACKPAD
    ============================================================
    */

    document.addEventListener(
      "wheel",
      (event) => {

        if (event.deltaY <= 0) {

          resetOverscroll();

          return;
        }


        clearTimeout(resetTimer);


        topAnchor.style.transition = "none";
        name.style.transition = "none";
        description.style.transition = "none";
        bottomAnchor.style.transition = "none";


        overscroll +=
          event.deltaY * RESISTANCE;


        overscroll =
          Math.min(
            overscroll,
            MAX_OVERSCROLL
          );


        applyOverscroll(overscroll);


        resetTimer = setTimeout(
          resetOverscroll,
          90
        );

      },
      {
        passive: true
      }
    );


    /*
    ============================================================
      KEYBOARD
    ============================================================
    */

    document.addEventListener(
      "keydown",
      (event) => {

        const scrollKeys = [
          "ArrowDown",
          "ArrowUp",
          "PageDown",
          "PageUp",
          "Home",
          "End",
          " "
        ];


        if (!scrollKeys.includes(event.key)) {
          return;
        }


        event.preventDefault();


        if (
          event.key === "ArrowDown" ||
          event.key === "PageDown" ||
          event.key === "End" ||
          event.key === " "
        ) {

          clearTimeout(resetTimer);

          overscroll = MAX_OVERSCROLL;

          applyOverscroll(overscroll);


          resetTimer = setTimeout(
            resetOverscroll,
            100
          );
        }

      }
    );

  </script>

</body>
</html>
