<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aditya — JEE Aspirant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #f5f5f5;
      overscroll-behavior: none;
      touch-action: none;
    }

    /* Subtle background atmosphere */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.035),
          transparent 38%
        );

      z-index: 0;
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 34px;

      border-bottom: 1px solid rgba(255,255,255,0.06);

      background: rgba(10,10,10,0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      z-index: 10;
    }

    .logo {
      color: #fff;
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #8e8e8e;
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;

      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #fff;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 24px 0;
    }

    /*
      IMPORTANT:

      The hero-content is NOT transformed.

      Its children are positioned normally, while
      the spacing between them is controlled using
      CSS variables.

      This means the text itself NEVER gets scaled.
    */

    .hero-content {
      width: min(720px, 100%);

      display: flex;
      flex-direction: column;
      align-items: center;

      --gap-top: 0px;
      --gap-name: 28px;
      --gap-description: 18px;
      --gap-buttons: 34px;
    }

    /* =========================
       TOP ANCHOR
    ========================= */

    .small-label {
      flex: 0 0 auto;

      color: #8d8d8d;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;

      /*
        This element is the TOP ANCHOR.
        It never moves.
      */
    }

    /* =========================
       NAME
    ========================= */

    .name {
      margin-top: var(--gap-name);

      color: #fff;

      font-size: clamp(52px, 9vw, 92px);
      line-height: 0.95;

      font-weight: 700;
      letter-spacing: 1.8px;

      white-space: nowrap;
    }

    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      max-width: 570px;

      margin-top: var(--gap-description);

      color: #8f8f8f;

      font-size: 15px;
      line-height: 1.7;

      text-align: center;
    }

    /* =========================
       BUTTONS
    ========================= */

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: var(--gap-buttons);

      /*
        These are the BOTTOM ANCHORS.
        They don't move during overscroll.
      */
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      height: 44px;
      padding: 0 20px;

      border-radius: 8px;

      text-decoration: none;

      font-size: 13px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button-primary {
      background: #fff;
      color: #0a0a0a;
    }

    .button-primary:hover {
      transform: translateY(-2px);
      background: #e9e9e9;
    }

    .button-secondary {
      color: #eee;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.035);
    }

    .button-secondary:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.07);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      nav {
        height: 62px;
        padding: 0 20px;
      }

      .nav-links {
        gap: 18px;
      }

      .nav-links a {
        font-size: 12px;
      }

      .hero {
        padding-top: 62px;
      }

      .hero-content {
        --gap-name: 24px;
        --gap-description: 16px;
        --gap-buttons: 28px;
      }

      .small-label {
        font-size: 12px;
      }

      .name {
        font-size: clamp(48px, 15vw, 70px);
        letter-spacing: 1px;
      }

      .description {
        max-width: 330px;
        font-size: 14px;
        line-height: 1.65;
      }

      .hero-buttons {
        gap: 9px;
      }

      .button {
        height: 42px;
        padding: 0 16px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav>
    <a href="index.html" class="logo">ADITYA</a>

    <div class="nav-links">
      <a href="projects.html">Projects</a>

      <a
        href="https://github.com/aditya20490"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>
    </div>
  </nav>


  <!-- HERO -->
  <main class="hero">

    <div class="hero-content" id="heroContent">

      <!-- TOP ANCHOR -->
      <div class="small-label" id="topAnchor">
        JEE Aspirant
      </div>


      <!-- MIDDLE CONTENT -->
      <h1 class="name" id="name">
        ADITYA
      </h1>

      <p class="description" id="description">
        I build websites, tools and experiments to solve the small problems I come across.
      </p>


      <!-- BOTTOM ANCHOR -->
      <div class="hero-buttons" id="bottomAnchor">

        <a
          href="projects.html"
          class="button button-primary"
        >
          Explore My Projects
        </a>

        <a
          href="https://github.com/aditya20490"
          target="_blank"
          rel="noopener noreferrer"
          class="button button-secondary"
        >
          GitHub ↗
        </a>

      </div>

    </div>

  </main>


  <script>

    /*
      ============================================================
      ELASTIC OVERSCROLL
      ============================================================

      No element is scaled.

      We only modify the vertical spacing between elements.

      TOP overscroll:
        JEE Aspirant stays fixed.
        Everything below it compresses upward.

      BOTTOM overscroll:
        Buttons stay fixed.
        Everything above them compresses downward.

      When released:
        The original spacing smoothly returns.
    */


    const hero = document.getElementById("heroContent");

    const MAX_PULL = 34;

    let pull = 0;
    let startY = null;
    let lastY = null;

    let animationFrame = null;


    /*
      Apply the elastic spacing.

      We progressively reduce the gaps between the
      elements rather than transforming the elements.
    */

    function applyElastic(value) {

      /*
        value > 0
        = user is trying to go DOWN the page
        = top anchor stays fixed
        = lower content compresses upward
      */

      if (value > 0) {

        const amount = Math.min(value, MAX_PULL);

        /*
          The farther elements are from the anchor,
          the more their spacing is compressed.
        */

        hero.style.setProperty(
          "--gap-name",
          `${28 - amount * 0.32}px`
        );

        hero.style.setProperty(
          "--gap-description",
          `${18 - amount * 0.22}px`
        );

        hero.style.setProperty(
          "--gap-buttons",
          `${34 - amount * 0.28}px`
        );

      }


      /*
        value < 0
        = user is trying to go UP the page
        = bottom anchor stays fixed
        = upper content compresses toward buttons
      */

      else {

        const amount = Math.min(Math.abs(value), MAX_PULL);

        hero.style.setProperty(
          "--gap-name",
          `${28 - amount * 0.28}px`
        );

        hero.style.setProperty(
          "--gap-description",
          `${18 - amount * 0.22}px`
        );

        hero.style.setProperty(
          "--gap-buttons",
          `${34 - amount * 0.32}px`
        );

      }

    }


    /*
      Smoothly return to the original layout.
    */

    function resetElastic() {

      hero.style.transition = `
        --gap-name 420ms cubic-bezier(.22,.8,.25,1),
        --gap-description 420ms cubic-bezier(.22,.8,.25,1),
        --gap-buttons 420ms cubic-bezier(.22,.8,.25,1)
      `;

      hero.style.setProperty("--gap-name", "28px");
      hero.style.setProperty("--gap-description", "18px");
      hero.style.setProperty("--gap-buttons", "34px");

      pull = 0;

      setTimeout(() => {
        hero.style.transition = "";
      }, 450);
    }


    /*
      ------------------------------------------------------------
      TOUCH
      ------------------------------------------------------------
    */

    document.addEventListener(
      "touchstart",
      (event) => {

        if (event.touches.length !== 1) return;

        startY = event.touches[0].clientY;
        lastY = startY;

        hero.style.transition = "none";

      },
      { passive: true }
    );


    document.addEventListener(
      "touchmove",
      (event) => {

        if (startY === null) return;

        const currentY = event.touches[0].clientY;

        /*
          Finger moving upward:
          currentY becomes smaller.

          That means the user is trying to scroll DOWN.
        */

        const delta = startY - currentY;

        /*
          Resistance curve.

          The farther they pull,
          the harder it becomes to pull.
        */

        const resisted =
          Math.sign(delta) *
          Math.min(
            Math.abs(delta) * 0.28,
            MAX_PULL
          );

        pull = resisted;

        applyElastic(pull);

        lastY = currentY;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      () => {

        if (startY === null) return;

        resetElastic();

        startY = null;
        lastY = null;

      },
      { passive: true }
    );


    /*
      ------------------------------------------------------------
      MOUSE WHEEL
      ------------------------------------------------------------

      Desktop users also get the same effect.
    */

    let wheelTimeout;

    document.addEventListener(
      "wheel",
      (event) => {

        event.preventDefault();

        hero.style.transition = "none";

        /*
          Accumulate wheel movement.
        */

        pull += event.deltaY * 0.12;

        pull = Math.max(
          -MAX_PULL,
          Math.min(MAX_PULL, pull)
        );

        applyElastic(pull);

        clearTimeout(wheelTimeout);

        wheelTimeout = setTimeout(() => {
          resetElastic();
        }, 90);

      },
      { passive: false }
    );


    /*
      ------------------------------------------------------------
      KEYBOARD
      ------------------------------------------------------------

      Prevent keyboard scrolling because this page has
      intentionally been designed as a single-screen homepage.
    */

    document.addEventListener(
      "keydown",
      (event) => {

        const scrollingKeys = [
          "ArrowUp",
          "ArrowDown",
          "PageUp",
          "PageDown",
          "Home",
          "End",
          " "
        ];

        if (scrollingKeys.includes(event.key)) {

          event.preventDefault();

          hero.style.transition = "none";

          if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === "End" ||
            event.key === " "
          ) {
            pull = MAX_PULL;
          }

          if (
            event.key === "ArrowUp" ||
            event.key === "PageUp" ||
            event.key === "Home"
          ) {
            pull = -MAX_PULL;
          }

          applyElastic(pull);

          clearTimeout(animationFrame);

          animationFrame = setTimeout(() => {
            resetElastic();
          }, 120);

        }

      }
    );

  </script>

</body>
</html>
