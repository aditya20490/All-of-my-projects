<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aditya — JEE Aspirant</title>

    <meta name="description"
          content="Aditya's personal website — websites, tools and experiments I've created.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #0a0a0a;
            color: #f5f5f5;
            line-height: 1.6;

            overscroll-behavior: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- Background Glow ---------- */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -250px;
            left: 50%;

            transform: translateX(-50%);

            background: radial-gradient(
                circle,
                rgba(255,255,255,0.07),
                transparent 70%
            );

            pointer-events: none;

            z-index: 0;
        }

        /* ---------- Navigation ---------- */

        nav {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            background: rgba(10,10,10,0.75);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255,255,255,0.07);

            z-index: 100;
        }

        .logo {
            font-size: 20px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;

            gap: 28px;

            list-style: none;

            color: #aaa;

            font-size: 14px;
        }

        .nav-links a {
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
        }

        /* ---------- Hero ---------- */

        .hero {
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 70px 20px 20px;

            position: relative;

            z-index: 1;

            overflow: hidden;
        }

        .hero-content {
            width: 100%;
            max-width: 800px;

            transform: translateY(-2px);
        }

        .small-label {
            display: inline-block;

            color: #aaa;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 20px;
        }

        /* ---------- Main Name ---------- */

        .hero h1 {
            font-size: clamp(55px, 10vw, 110px);

            line-height: 0.95;

            font-weight: 800;

            letter-spacing: 1.5px;

            margin-bottom: 28px;
        }

        .hero p {
            max-width: 600px;

            margin: auto;

            color: #aaa;

            font-size: 18px;

            line-height: 1.7;
        }

        /* ---------- Buttons ---------- */

        .hero-buttons {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 12px 22px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            transition: all 0.2s ease;
        }

        .button-primary {
            background: white;
            color: black;
        }

        .button-primary:hover {
            transform: translateY(-2px);

            background: #e8e8e8;
        }

        .button-secondary {
            border: 1px solid #333;

            color: #ddd;
        }

        .button-secondary:hover {
            border-color: #666;

            transform: translateY(-2px);
        }

        /* ---------- Mobile ---------- */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;

                font-size: 12px;
            }

            .hero {
                padding-left: 20px;
                padding-right: 20px;
            }

            .hero h1 {
                letter-spacing: 1px;
            }

            .hero p {
                font-size: 16px;

                max-width: 500px;
            }
        }

        /* ---------- Very Small Screens ---------- */

        @media (max-height: 600px) {

            .hero h1 {
                font-size: clamp(45px, 9vw, 75px);

                margin-bottom: 20px;
            }

            .small-label {
                margin-bottom: 12px;
            }

            .hero-buttons {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->

    <nav>

        <a href="index.html" class="logo">
            ADITYA
        </a>

        <ul class="nav-links">

            <li>
                <a href="projects.html">
                    Projects
                </a>
            </li>

            <li>
                <a href="https://github.com/aditya20490"
                   target="_blank"
                   rel="noopener noreferrer">
                    GitHub
                </a>
            </li>

        </ul>

    </nav>


    <!-- Homepage -->

    <main class="hero">

        <div class="hero-content">

            <div class="small-label">
                JEE Aspirant
            </div>

            <h1>
                ADITYA
            </h1>

            <p>
                I build websites, tools and experiments to solve
                the small problems I come across.
            </p>

            <div class="hero-buttons">

                <a href="projects.html"
                   class="button button-primary">
                    Explore My Projects
                </a>

                <a href="https://github.com/aditya20490"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="button button-secondary">
                    GitHub ↗
                </a>

            </div>

        </div>

    </main>

</body>
</html>
